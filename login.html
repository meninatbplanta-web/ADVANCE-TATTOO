<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Portal do Aluno | Advanced Tattoo School</title>
    <meta name="description" content="Login para alunos do curso Advanced Tattoo.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="portal.css">
</head>
<body class="login-page">

    <div class="login-container">
        <img src="assets/logo-hub.jpg" alt="Logo Advanced" class="login-logo">
        <h1 class="login-title">Acesso ao Portal do Aluno</h1>
        
        <form action="portal.html" method="GET">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" class="input-field" placeholder="seu@email.com" required>
            </div>
            
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" class="input-field" placeholder="••••••••" required>
                <!-- Eye Icon SVG -->
                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </div>
            
            <div style="text-align: right; margin-bottom: 2rem;">
                <a href="#" style="font-size: 0.85rem; color: var(--lms-text-muted);">Esqueceu sua senha?</a>
            </div>
            
            <button type="submit" class="btn-red" style="width: 100%;">Entrar</button>
        </form>
    </div>

</body>
</html>
