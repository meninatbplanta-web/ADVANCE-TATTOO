<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub | Advanced Tattoo School</title>
    <meta name="description" content="Onde a técnica se torna arte. Acesse nossos cursos, portal do aluno e encontre tatuadores certificados.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .hub-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 80px 0;
            background-image: linear-gradient(to right, rgba(10, 10, 12, 0.95) 0%, rgba(10, 10, 12, 0.8) 100%), url('https://images.unsplash.com/photo-1611501275019-9b5cda994e8d?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .hub-container {
            max-width: 600px;
            width: 100%;
        }
        .hub-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .hub-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-primary);
            margin-bottom: 1rem;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }
        .hub-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .mentor-card-hub {
            margin-top: 3rem;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        .mentor-card-hub img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--glass-border);
        }
        .footer-hub {
            margin-top: 3rem;
            text-align: center;
            padding-top: 2rem;
            border-top: 1px solid var(--glass-border);
        }
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1rem;
        }
        .social-icons a {
            color: var(--text-muted);
        }
        .social-icons a:hover {
            color: var(--accent-primary);
        }
    </style>
</head>
<body class="hub-page">
    <div class="container hub-container">
        
        <header class="hub-header">
            <img src="assets/logo-hub.jpg" alt="Advanced Tattoo School Logo" class="hub-logo">
            <h1 class="section-title" style="margin-bottom: 0.5rem; font-size: 2.2rem;">Advanced Tattoo School</h1>
            <p class="section-subtitle">Onde a técnica se torna arte.</p>
        </header>

        <div class="hub-buttons">
            <a href="advanced-track.html" class="btn btn-primary w-100" style="padding: 18px;">
                ⚡ Especialização Advanced Track
            </a>
            <a href="iniciantes.html" class="btn btn-primary w-100" style="padding: 18px;">
                🎓 Do Zero à Tattoo (Iniciantes)
            </a>
            
            <div class="grid-2" style="gap: 1rem; margin-top: 1rem;">
                <a href="#" class="btn btn-secondary w-100" style="padding: 14px;">
                    👤 Portal do Aluno
                </a>
                <a href="#" class="btn btn-secondary w-100" style="padding: 14px;">
                    🛒 Advanced Shop
                </a>
            </div>

            <a href="#" class="btn btn-outline w-100 mt-5" style="padding: 18px;">
                📍 Encontre um Tatuador Certificado
            </a>
        </div>

        <div class="glass-panel mentor-card-hub">
            <img src="assets/ronaldo-hub.jpg" alt="Ronaldo Advance">
            <div>
                <h3 style="font-family: var(--font-heading); color: var(--text-main); margin-bottom: 4px;">Ronaldo Advance</h3>
                <p class="text-sm text-muted">CEO, Fundador & Mentor. Atuando no universo da Body Art desde 2003.</p>
            </div>
        </div>

        <footer class="footer-hub">
            <div class="social-icons">
                <a href="#" aria-label="Instagram">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                </a>
                <a href="#" aria-label="YouTube">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33 2.78 2.78 0 0 0 1.94 2c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.33 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></svg>
                </a>
                <a href="https://wa.me/5511999999999" aria-label="WhatsApp">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                </a>
            </div>
            <p class="text-sm text-muted">EST. 2003</p>
        </footer>

    </div>
</body>
</html>
